name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '0.1.0'

env:
  PYTHON_VERSION: '3.9'

jobs:
  # Windows Build Job
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m venv venv
        .\venv\Scripts\activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.11.1 pillow

    - name: Convert icon
      run: |
        .\venv\Scripts\activate
        python convert_icon.py

    - name: Build with PyInstaller
      run: |
        .\venv\Scripts\activate
        pyinstaller --clean --noconfirm baal_windows.spec

    - name: Create installer
      run: |
        # Download and install Inno Setup
        $url = "https://jrsoftware.org/download.php/is.exe"
        Invoke-WebRequest -Uri $url -OutFile innosetup.exe -UseBasicParsing
        Start-Process -FilePath innosetup.exe -ArgumentList "/VERYSILENT /SP-" -Wait
        
        # Build installer
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q installer\baal_installer.iss

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-builds
        path: |
          dist\*.exe
          installer\Output\*.exe
        retention-days: 30

  # macOS Build Job
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        brew install create-dmg || true
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.11.1 dmgbuild pillow

    - name: Prepare icons
      run: |
        source venv/bin/activate
        
        # Create icns if not exists
        if [ ! -f "baal/resources/cat.icns" ]; then
          mkdir -p cat.iconset
          sips -z 16 16     baal/resources/cat.png --out cat.iconset/icon_16x16.png
          sips -z 32 32     baal/resources/cat.png --out cat.iconset/icon_32x32.png
          sips -z 128 128   baal/resources/cat.png --out cat.iconset/icon_128x128.png
          sips -z 256 256   baal/resources/cat.png --out cat.iconset/icon_256x256.png
          sips -z 512 512   baal/resources/cat.png --out cat.iconset/icon_512x512.png
          iconutil -c icns cat.iconset -o baal/resources/cat.icns
          rm -rf cat.iconset
        fi

    - name: Build with PyInstaller
      run: |
        source venv/bin/activate
        pyinstaller --clean --noconfirm baal_macos.spec

    - name: Create DMG
      run: |
        APP_NAME="Baal Pet Assistant"
        
        # Method 1: Try create-dmg first
        create-dmg \
          --volname "$APP_NAME" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "$APP_NAME.app" 150 190 \
          --app-drop-link 450 190 \
          "dist/$APP_NAME.dmg" \
          "dist/$APP_NAME.app" || {
            # Method 2: Fallback to hdiutil
            hdiutil create -volname "$APP_NAME" -srcfolder "dist/$APP_NAME.app" -ov -format UDZO "dist/$APP_NAME.dmg"
          }

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-builds
        path: |
          dist/*.dmg
          dist/*.app
        retention-days: 30

  # Linux Build Job (Optional)
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pyqt6 libxcb-xinerama0

    - name: Install Python dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.11.1

    - name: Build with PyInstaller
      run: |
        source venv/bin/activate
        # Create a Linux-specific spec if needed, otherwise use the default
        pyinstaller --clean --noconfirm \
          --name "BaalPetAssistant" \
          --onefile \
          --windowed \
          --add-data "baal/resources:baal/resources" \
          --add-data "动作表情拆分:动作表情拆分" \
          --add-data "baal/references:baal/references" \
          run_desktop_pet.py

    - name: Create AppImage (optional)
      run: |
        # Download appimagetool
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        
        # Create AppDir structure
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        
        # Copy files
        cp dist/BaalPetAssistant AppDir/usr/bin/
        cp baal/resources/cat.png AppDir/usr/share/icons/hicolor/256x256/apps/baal.png
        
        # Create desktop file
        cat > AppDir/usr/share/applications/baal.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=Baal Pet Assistant
        Exec=BaalPetAssistant
        Icon=baal
        Categories=Utility;
        EOF
        
        # Create AppImage
        ./appimagetool-x86_64.AppImage AppDir dist/BaalPetAssistant.AppImage || true

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-builds
        path: |
          dist/BaalPetAssistant
          dist/*.AppImage
        retention-days: 30

  # Create Release
  create-release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir release-files
        
        # Copy Windows files
        cp artifacts/windows-builds/dist/*.exe release-files/ || true
        cp artifacts/windows-builds/installer/Output/*.exe release-files/ || true
        
        # Copy macOS files
        cp artifacts/macos-builds/dist/*.dmg release-files/ || true
        
        # Copy Linux files
        cp artifacts/linux-builds/dist/BaalPetAssistant release-files/BaalPetAssistant-linux || true
        cp artifacts/linux-builds/dist/*.AppImage release-files/ || true
        
        # List all files
        ls -la release-files/

    - name: Get version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: Release v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: release-files/*
        body: |
          # 🎉 Baal Pet Assistant v${{ steps.version.outputs.VERSION }}
          
          ## 📦 Download Instructions
          
          ### Windows
          - **Installer**: `BaalPetAssistantSetup.exe` - Recommended, includes start menu and uninstaller
          - **Portable**: `Baal宠物助手.exe` - No installation required
          
          ### macOS
          - **DMG**: `Baal Pet Assistant.dmg` - Drag to Applications folder
          - **Note**: On first run, right-click and select "Open" to bypass Gatekeeper
          
          ### Linux
          - **AppImage**: `BaalPetAssistant.AppImage` - Make executable and run
          - **Binary**: `BaalPetAssistant-linux` - Direct executable
          
          ## 💻 System Requirements
          
          - **Windows**: Windows 10 1903 or higher
          - **macOS**: macOS 11.0 Big Sur or higher
          - **Linux**: Ubuntu 20.04+ or equivalent
          - Internet connection required for AI features
          
          ## 🐛 Bug Reports
          
          Please report issues at: https://github.com/${{ github.repository }}/issues
          
          ---
          *Built with GitHub Actions CI/CD*