name: Build Windows (Fast)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'
  APP_NAME: 'Baal宠物助手'
  APP_NAME_EN: 'BaalPetAssistant'

jobs:
  build-windows-fast:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Cache virtual environment
      uses: actions/cache@v3
      with:
        path: venv
        key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-venv-

    - name: Setup environment
      run: |
        # Create or use cached venv
        if (!(Test-Path venv)) {
          python -m venv venv
        }
        .\venv\Scripts\activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.11.1 pillow

    - name: Convert icon
      run: |
        .\venv\Scripts\activate
        python convert_icon.py

    - name: Build with PyInstaller
      run: |
        .\venv\Scripts\activate
        pyinstaller --clean --noconfirm baal_windows.spec

    - name: Create ZIP Package
      run: |
        Write-Host "Creating comprehensive ZIP package..."
        
        # Find the exe
        $exePath = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
        if (-not $exePath) {
          Write-Host "❌ No exe file found!"
          exit 1
        }
        
        # Create package directory
        $packageDir = "dist\BaalPetAssistant"
        New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
        
        # Copy main executable
        Copy-Item $exePath.FullName -Destination "$packageDir\$($exePath.Name)"
        
        # Copy resources
        if (Test-Path "baal\resources") {
          Copy-Item -Path "baal\resources" -Destination "$packageDir\resources" -Recurse -Force
        }
        if (Test-Path "动作表情拆分") {
          Copy-Item -Path "动作表情拆分" -Destination "$packageDir\动作表情拆分" -Recurse -Force
        }
        
        # Create batch file for easy start
        $batchLines = @(
          "@echo off",
          "echo Starting Baal Pet Assistant...",
          'start "" "%~dp0Baal宠物助手.exe"'
        )
        $batchLines -join "`r`n" | Out-File -FilePath "$packageDir\Start.bat" -Encoding ASCII
        
        # Create README
        $readmeLines = @(
          "Baal Pet Assistant - Quick Start Guide",
          "=======================================",
          "",
          "1. Double-click 'Start.bat' or 'Baal宠物助手.exe' to run",
          "2. Configure API keys on first run (right-click the cat icon)",
          "3. Enjoy your AI desktop companion!",
          "",
          "For help: https://github.com/dazhanzheng/WatchCats"
        )
        $readmeLines -join "`n" | Out-File -FilePath "$packageDir\README.txt" -Encoding UTF8
        
        # Create ZIP
        $zipPath = "dist\BaalPetAssistant-Windows.zip"
        Compress-Archive -Path $packageDir -DestinationPath $zipPath -Force
        
        if (Test-Path $zipPath) {
          $zipInfo = Get-Item $zipPath
          Write-Host "✅ ZIP package created: $($zipInfo.Name)"
          Write-Host "   Size: $([math]::Round($zipInfo.Length / 1MB, 2)) MB"
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-package-fast
        path: |
          dist\BaalPetAssistant-Windows.zip
        retention-days: 30