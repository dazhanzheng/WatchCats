name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.9'
  APP_NAME: 'Baal Pet Assistant'
  APP_NAME_CN: 'Baal宠物助手'
  BUNDLE_ID: 'com.baal.pet'

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        # Install Homebrew packages if needed
        brew install create-dmg || true
        
    - name: Create virtual environment and install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.11.1
        pip install dmgbuild
        pip install pillow  # For icon conversion

    - name: Convert and prepare icons
      run: |
        source venv/bin/activate
        
        # Create icns from PNG if not exists
        if [ ! -f "baal/resources/cat.icns" ]; then
          echo "Creating icns file from PNG..."
          
          # Create iconset directory
          mkdir -p cat.iconset
          
          # Generate different sizes using sips
          sips -z 16 16     baal/resources/cat.png --out cat.iconset/icon_16x16.png
          sips -z 32 32     baal/resources/cat.png --out cat.iconset/icon_16x16@2x.png
          sips -z 32 32     baal/resources/cat.png --out cat.iconset/icon_32x32.png
          sips -z 64 64     baal/resources/cat.png --out cat.iconset/icon_32x32@2x.png
          sips -z 128 128   baal/resources/cat.png --out cat.iconset/icon_128x128.png
          sips -z 256 256   baal/resources/cat.png --out cat.iconset/icon_128x128@2x.png
          sips -z 256 256   baal/resources/cat.png --out cat.iconset/icon_256x256.png
          sips -z 512 512   baal/resources/cat.png --out cat.iconset/icon_256x256@2x.png
          sips -z 512 512   baal/resources/cat.png --out cat.iconset/icon_512x512.png
          sips -z 1024 1024 baal/resources/cat.png --out cat.iconset/icon_512x512@2x.png
          
          # Convert to icns
          iconutil -c icns cat.iconset -o baal/resources/cat.icns
          
          # Clean up
          rm -rf cat.iconset
        fi
        
        # Also create watch_cats.icns if needed
        if [ ! -f "baal/resources/watch_cats.icns" ]; then
          cp baal/resources/cat.icns baal/resources/watch_cats.icns
        fi

    - name: Build with PyInstaller
      run: |
        source venv/bin/activate
        
        # Clean previous builds
        rm -rf build dist
        
        # Build the app
        if [ -f "baal_macos.spec" ]; then
          pyinstaller --clean --noconfirm baal_macos.spec
        else
          pyinstaller --clean --noconfirm baal.spec
        fi
        
        # Check if app was created
        if [ -d "dist/${{ env.APP_NAME }}.app" ] || [ -d "dist/Watch Cats.app" ]; then
          echo "✓ App bundle created successfully"
          ls -la dist/
        else
          echo "✗ App bundle creation failed!"
          exit 1
        fi

    - name: Sign the app (if certificates available)
      if: env.MACOS_CERTIFICATE
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
      run: |
        # Import certificate
        echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
        security create-keychain -p actions temp.keychain
        security default-keychain -s temp.keychain
        security unlock-keychain -p actions temp.keychain
        security import certificate.p12 -k temp.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions temp.keychain
        
        # Sign the app
        APP_PATH=$(find dist -name "*.app" -type d | head -1)
        codesign --deep --force --verify --verbose --sign "$MACOS_IDENTITY" "$APP_PATH"
        
        echo "✓ App signed successfully"

    - name: Create DMG with create-dmg
      run: |
        # Find the app name
        APP_PATH=$(find dist -name "*.app" -type d | head -1)
        APP_NAME=$(basename "$APP_PATH" .app)
        
        # Create DMG using create-dmg for a professional look
        create-dmg \
          --volname "$APP_NAME" \
          --volicon "baal/resources/cat.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "$APP_NAME.app" 150 190 \
          --hide-extension "$APP_NAME.app" \
          --app-drop-link 450 190 \
          --background "installer/dmg_background.png" \
          --no-internet-enable \
          "dist/${APP_NAME}.dmg" \
          "$APP_PATH" || {
            # Fallback to simple DMG if create-dmg fails
            echo "create-dmg failed, using fallback method..."
            hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "dist/${APP_NAME}.dmg"
          }
        
        # Check DMG size
        if [ -f "dist/${APP_NAME}.dmg" ]; then
          DMG_SIZE=$(du -h "dist/${APP_NAME}.dmg" | cut -f1)
          echo "✓ DMG created successfully: dist/${APP_NAME}.dmg ($DMG_SIZE)"
        else
          echo "✗ DMG creation failed!"
          exit 1
        fi

    - name: Notarize app (if credentials available)
      if: env.APPLE_ID
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        # Find DMG file
        DMG_PATH=$(find dist -name "*.dmg" | head -1)
        
        # Submit for notarization
        xcrun notarytool submit "$DMG_PATH" \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait
        
        # Staple the notarization
        xcrun stapler staple "$DMG_PATH"
        
        echo "✓ DMG notarized successfully"

    - name: Create version info
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="0.1.0-dev"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: BaalPetAssistant-macOS-dmg
        path: dist/*.dmg
        retention-days: 30

    - name: Upload APP artifact
      uses: actions/upload-artifact@v4
      with:
        name: BaalPetAssistant-macOS-app
        path: dist/*.app
        retention-days: 30

    - name: Create Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.dmg
        body: |
          ## macOS版本
          
          ### 安装方法：
          1. 下载 DMG 文件
          2. 双击打开 DMG
          3. 将应用拖拽到 Applications 文件夹
          4. 首次运行时，右键点击并选择"打开"
          
          ### 系统要求：
          - macOS 11.0 Big Sur 或更高版本
          - Apple Silicon (M1/M2) 和 Intel 处理器均支持
          
          ---
          自动生成于 GitHub Actions
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, 'dev') }}