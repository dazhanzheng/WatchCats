name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.9'
  APP_NAME: 'Baal宠物助手'
  APP_NAME_EN: 'BaalPetAssistant'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Create virtual environment
      run: |
        python -m venv venv
        echo "Virtual environment created"

    - name: Install dependencies
      run: |
        .\venv\Scripts\activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.11.1
        pip install pillow  # 用于图标转换

    - name: Convert icon
      run: |
        .\venv\Scripts\activate
        python convert_icon.py
        
    - name: Build with PyInstaller
      run: |
        .\venv\Scripts\activate
        pyinstaller --clean --noconfirm baal_windows.spec
        
    - name: Test executable
      run: |
        # 简单测试exe是否能运行
        if (Test-Path "dist\${{ env.APP_NAME }}.exe") {
          Write-Host "✓ Executable found: dist\${{ env.APP_NAME }}.exe"
          $fileInfo = Get-Item "dist\${{ env.APP_NAME }}.exe"
          Write-Host "  Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
        } else {
          Write-Host "✗ Executable not found!"
          exit 1
        }

    - name: Create version info
      id: version
      run: |
        # 获取版本信息
        if ($env:GITHUB_REF -match 'refs/tags/v(.*)') {
          $version = $matches[1]
        } else {
          $version = "0.1.0-dev"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
        
    - name: Cache Inno Setup
      id: cache-inno
      uses: actions/cache@v3
      with:
        path: C:\Program Files (x86)\Inno Setup 6
        key: ${{ runner.os }}-inno-setup-6.2.2
    
    - name: Install Inno Setup
      if: steps.cache-inno.outputs.cache-hit != 'true'
      run: |
        # Use GitHub releases for faster download
        $url = "https://github.com/jrsoftware/issrc/releases/download/is-6.2.2/innosetup-6.2.2.exe"
        $output = "innosetup.exe"
        
        # Download with progress tracking
        Write-Host "Downloading Inno Setup from GitHub..."
        $start = Get-Date
        Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
        $duration = (Get-Date) - $start
        Write-Host "Download completed in $($duration.TotalSeconds) seconds"
        
        # Install silently
        Write-Host "Installing Inno Setup..."
        Start-Process -FilePath $output -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait
        
        # Verify installation
        if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
          Write-Host "✓ Inno Setup installed successfully"
        } else {
          Write-Host "✗ Installation failed"
          exit 1
        }
        
    - name: Add Inno Setup to PATH
      run: |
        if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
        } elseif (Test-Path "C:\Program Files\Inno Setup 6") {
          echo "C:\Program Files\Inno Setup 6" >> $env:GITHUB_PATH
        }

    - name: Build installer with Inno Setup
      run: |
        # 查找并编译Inno Setup脚本
        $isccPath = ""
        if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
          $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
        } else {
          Write-Host "Error: ISCC.exe not found!"
          exit 1
        }
        
        Write-Host "Using ISCC at: $isccPath"
        & "$isccPath" /Q installer\baal_installer.iss
        
        # 检查输出
        if (Test-Path "installer\Output\${{ env.APP_NAME_EN }}Setup.exe") {
          Write-Host "✓ Installer created successfully"
          $fileInfo = Get-Item "installer\Output\${{ env.APP_NAME_EN }}Setup.exe"
          Write-Host "  Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
        }

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME_EN }}-portable-windows
        path: dist\${{ env.APP_NAME }}.exe
        retention-days: 30

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME_EN }}-installer-windows
        path: installer\Output\${{ env.APP_NAME_EN }}Setup.exe
        retention-days: 30

    - name: Create Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist\${{ env.APP_NAME }}.exe
          installer\Output\${{ env.APP_NAME_EN }}Setup.exe
        body: |
          ## 下载说明 / Download Instructions
          
          ### Windows用户：
          - **安装版**: `${{ env.APP_NAME_EN }}Setup.exe` - 推荐，包含开始菜单和卸载程序
          - **便携版**: `${{ env.APP_NAME }}.exe` - 无需安装，直接运行
          
          ### 系统要求：
          - Windows 10 1903 或更高版本
          - 需要网络连接（AI功能）
          
          ---
          自动生成于 GitHub Actions
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, 'dev') }}