name: Build Windows Package

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: '3.9'
  APP_NAME: 'Baal宠物助手'
  APP_NAME_EN: 'BaalPetAssistant'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Create virtual environment
      run: |
        python -m venv venv
        echo "Virtual environment created"

    - name: Install dependencies
      run: |
        .\venv\Scripts\activate
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.11.1
        pip install pillow  # 用于图标转换

    - name: Convert icon
      run: |
        .\venv\Scripts\activate
        python convert_icon.py
        
    - name: Build with PyInstaller
      run: |
        .\venv\Scripts\activate
        pyinstaller --clean --noconfirm baal_windows.spec
        
    - name: Test executable
      run: |
        # 简单测试exe是否能运行
        if (Test-Path "dist\${{ env.APP_NAME }}.exe") {
          Write-Host "✓ Executable found: dist\${{ env.APP_NAME }}.exe"
          $fileInfo = Get-Item "dist\${{ env.APP_NAME }}.exe"
          Write-Host "  Size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
        } else {
          Write-Host "✗ Executable not found!"
          exit 1
        }

    - name: Create version info
      id: version
      run: |
        # 获取版本信息
        if ($env:GITHUB_REF -match 'refs/tags/v(.*)') {
          $version = $matches[1]
        } else {
          $version = "0.1.0-dev"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version: $version"
        
    - name: Create ZIP Package
      run: |
        Write-Host "Creating ZIP package..."
        
        # Find the exe file
        $exePath = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
        if (-not $exePath) {
          Write-Host "❌ No exe file found in dist/"
          exit 1
        }
        
        # Create package directory
        $packageDir = "dist\BaalPetAssistant"
        New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
        
        # Copy executable
        Copy-Item $exePath.FullName -Destination "$packageDir\$($exePath.Name)"
        
        # Copy resources if they exist separately
        if (Test-Path "baal\resources") {
          Copy-Item -Path "baal\resources" -Destination "$packageDir\resources" -Recurse -Force
        }
        if (Test-Path "动作表情拆分") {
          Copy-Item -Path "动作表情拆分" -Destination "$packageDir\动作表情拆分" -Recurse -Force
        }
        
        # Create README
        $readme = @"
Baal Pet Assistant (Baal宠物助手) - Windows Version
=====================================================

How to Run:
-----------
1. Extract all files to a folder
2. Run 'Baal宠物助手.exe' or 'BaalPetAssistant.exe'
3. Configure API keys on first run

Requirements:
-------------
- Windows 10 or later
- Internet connection for AI features

First Run:
----------
1. The app will appear as a floating cat icon
2. Right-click to access settings
3. Configure your OpenAI or Volcengine API key

Support:
--------
GitHub: https://github.com/dazhanzheng/WatchCats
"@
        $readme | Out-File -FilePath "$packageDir\README.txt" -Encoding UTF8
        
        # Create ZIP
        $zipPath = "dist\BaalPetAssistant-Windows.zip"
        Compress-Archive -Path $packageDir -DestinationPath $zipPath -Force
        
        if (Test-Path $zipPath) {
          $zipInfo = Get-Item $zipPath
          Write-Host "✅ ZIP package created successfully"
          Write-Host "📦 Package: $($zipInfo.Name)"
          Write-Host "📏 Size: $([math]::Round($zipInfo.Length / 1MB, 2)) MB"
          
          # List contents
          Write-Host "`nPackage contents:"
          Get-ChildItem -Path $packageDir -Recurse | ForEach-Object {
            $relativePath = $_.FullName.Replace("$packageDir\", "")
            if ($_.PSIsContainer) {
              Write-Host "  📁 $relativePath\"
            } else {
              $size = [math]::Round($_.Length / 1KB, 1)
              Write-Host "  📄 $relativePath ($size KB)"
            }
          }
        } else {
          Write-Host "❌ Failed to create ZIP package"
          exit 1
        }
      shell: pwsh

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME_EN }}-portable-windows
        path: dist\${{ env.APP_NAME }}.exe
        retention-days: 30

    - name: Upload ZIP package artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME_EN }}-package-windows
        path: dist\BaalPetAssistant-Windows.zip
        retention-days: 30

    - name: Create Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist\BaalPetAssistant-Windows.zip
        body: |
          ## 下载说明 / Download Instructions
          
          ### Windows用户：
          - **ZIP包**: `BaalPetAssistant-Windows.zip` - 解压即用
          - 包含所有必要的资源文件和表情素材
          
          ### 系统要求：
          - Windows 10 1903 或更高版本
          - 需要网络连接（AI功能）
          
          ---
          自动生成于 GitHub Actions
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, 'dev') }}