name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '0.1.0'
      prerelease:
        description: 'Is this a pre-release?'
        required: true
        type: boolean
        default: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Get version
      id: get_version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/v}
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Wait for build-windows workflow
      uses: lewagon/wait-on-check-action@v1.3.3
      with:
        ref: ${{ github.ref }}
        check-name: 'Build Windows Package'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 30
        allowed-conclusions: success,skipped
    
    - name: Download Windows artifacts
      uses: dawidd6/action-download-artifact@v3
      with:
        workflow: build-windows.yml
        workflow_conclusion: success
        name: windows-package
        path: ./artifacts
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: Release v${{ steps.get_version.outputs.VERSION }}
        draft: true
        prerelease: ${{ github.event.inputs.prerelease || contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'alpha') }}
        files: |
          ./artifacts/WatchCats-Windows.zip
          ./artifacts/WatchCats-Setup.exe
        body: |
          ## 🎉 WatchCats v${{ steps.get_version.outputs.VERSION }}
          
          ### ✨ 新功能
          - 功能1
          - 功能2
          
          ### 🐛 修复
          - 修复1
          - 修复2
          
          ### 📦 下载说明
          
          #### Windows用户：
          - **安装版** (`WatchCats-Setup.exe`): 推荐，自动安装依赖
          - **便携版** (`WatchCats-Windows.zip`): 解压即用
          
          ### 💻 系统要求
          - **Windows**: Windows 10 1903 或更高版本
          - 需要网络连接（AI功能）
          
          ### 📝 安装说明
          1. **推荐**：下载 `WatchCats-Setup.exe` 安装版
             - 双击运行安装程序
             - 按照向导完成安装
             - 自动安装所需的 Visual C++ 运行库
          
          2. **备选**：下载 `WatchCats-Windows.zip` 便携版
             - 解压到任意目录
             - 运行 `WatchCats.exe`
             - 如遇到闪退，请先安装 Visual C++ Redistributables
          
          ### ⚠️ 遇到问题？
          - 如果程序闪退：运行安装版或手动安装 [Visual C++ Redistributables](https://aka.ms/vs/17/release/vc_redist.x64.exe)
          - 更多帮助请访问：[Issues](https://github.com/${{ github.repository }}/issues)