name: Build on Self-Hosted Runner

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'macos'
        type: choice
        options:
          - macos
          - windows
          - both

env:
  PYTHON_VERSION: '3.9'
  APP_NAME: 'Baal Pet Assistant'

jobs:
  build-on-self-hosted:
    name: Build on Local Machine
    runs-on: self-hosted  # 使用你的本地runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true  # 清理工作目录
        
    - name: System Info
      run: |
        echo "🖥️ Running on self-hosted runner"
        echo "📍 Runner location: $(pwd)"
        echo "🔧 System: $(uname -a)"
        echo "🐍 Python: $(python3 --version)"
        echo "📦 Available tools:"
        which git && echo "  ✓ Git: $(git --version)"
        which python3 && echo "  ✓ Python3: $(python3 --version)"
        which pip3 && echo "  ✓ Pip3: $(pip3 --version)"
        
    - name: Setup Python Environment
      run: |
        # Check if venv exists and is valid
        if [ -d "venv" ] && [ -f "venv/bin/python" ]; then
          echo "✓ Using existing virtual environment"
        else
          echo "Creating new virtual environment..."
          python3 -m venv venv
        fi
        
        # Activate and update
        source venv/bin/activate
        python -m pip install --upgrade pip
        
    - name: Install/Update Dependencies
      run: |
        source venv/bin/activate
        
        # Check if requirements changed
        if [ -f ".last_requirements_hash" ]; then
          CURRENT_HASH=$(shasum -a 256 requirements.txt | cut -d' ' -f1)
          LAST_HASH=$(cat .last_requirements_hash)
          if [ "$CURRENT_HASH" = "$LAST_HASH" ]; then
            echo "✓ Requirements unchanged, skipping install"
          else
            echo "Requirements changed, updating..."
            pip install -r requirements.txt
            pip install pyinstaller==6.11.1 dmgbuild pillow
            echo "$CURRENT_HASH" > .last_requirements_hash
          fi
        else
          echo "First run, installing all requirements..."
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1 dmgbuild pillow
          shasum -a 256 requirements.txt | cut -d' ' -f1 > .last_requirements_hash
        fi
        
    - name: Prepare Icons (macOS)
      if: runner.os == 'macOS'
      run: |
        source venv/bin/activate
        
        # Check if icons already exist
        if [ -f "baal/resources/cat.icns" ]; then
          echo "✓ Icons already exist"
        else
          echo "Creating icons..."
          # Create icns from PNG
          mkdir -p cat.iconset
          sips -z 16 16     baal/resources/cat.png --out cat.iconset/icon_16x16.png
          sips -z 32 32     baal/resources/cat.png --out cat.iconset/icon_32x32.png
          sips -z 128 128   baal/resources/cat.png --out cat.iconset/icon_128x128.png
          sips -z 256 256   baal/resources/cat.png --out cat.iconset/icon_256x256.png
          sips -z 512 512   baal/resources/cat.png --out cat.iconset/icon_512x512.png
          iconutil -c icns cat.iconset -o baal/resources/cat.icns
          rm -rf cat.iconset
          
          # Copy for compatibility
          cp baal/resources/cat.icns baal/resources/watch_cats.icns
        fi
        
    - name: Build Application
      run: |
        source venv/bin/activate
        
        echo "🔨 Building application..."
        
        # Clean previous builds
        rm -rf build dist
        
        # Determine which spec to use
        if [[ "$OSTYPE" == "darwin"* ]] && [ -f "baal_macos.spec" ]; then
          echo "Using macOS spec file..."
          pyinstaller --clean --noconfirm baal_macos.spec
        elif [[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" ]] && [ -f "baal_windows.spec" ]; then
          echo "Using Windows spec file..."
          pyinstaller --clean --noconfirm baal_windows.spec
        else
          echo "Using default spec file..."
          pyinstaller --clean --noconfirm baal.spec
        fi
        
    - name: Create DMG (macOS)
      if: runner.os == 'macOS'
      run: |
        source venv/bin/activate
        
        echo "📦 Creating DMG installer..."
        
        # Find the app
        APP_PATH=$(find dist -name "*.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "❌ No app bundle found!"
          exit 1
        fi
        
        APP_NAME=$(basename "$APP_PATH" .app)
        DMG_NAME="${APP_NAME}-SelfHosted.dmg"
        
        # Create DMG
        if command -v create-dmg &> /dev/null; then
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 190 \
            --app-drop-link 450 190 \
            "dist/$DMG_NAME" \
            "$APP_PATH"
        else
          # Fallback to hdiutil
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "dist/$DMG_NAME"
        fi
        
        if [ -f "dist/$DMG_NAME" ]; then
          echo "✅ DMG created: dist/$DMG_NAME"
          echo "📊 Size: $(du -h "dist/$DMG_NAME" | cut -f1)"
        else
          echo "❌ DMG creation failed!"
          exit 1
        fi
        
    - name: Test Application
      run: |
        echo "🧪 Testing application..."
        
        if [[ "$OSTYPE" == "darwin"* ]]; then
          # Test macOS app
          APP_PATH=$(find dist -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            # Check if app bundle is valid
            if [ -f "$APP_PATH/Contents/MacOS/Baal Pet Assistant" ] || [ -f "$APP_PATH/Contents/MacOS/Watch Cats" ]; then
              echo "✅ App bundle structure valid"
              # Could add more tests here
            else
              echo "❌ App bundle structure invalid!"
              exit 1
            fi
          fi
        elif [[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" ]]; then
          # Test Windows exe
          EXE_PATH=$(find dist -name "*.exe" | head -1)
          if [ -f "$EXE_PATH" ]; then
            echo "✅ Executable found: $EXE_PATH"
          else
            echo "❌ Executable not found!"
            exit 1
          fi
        fi
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: self-hosted-build-${{ github.run_number }}
        path: |
          dist/*.dmg
          dist/*.app
          dist/*.exe
          dist/*.zip
        retention-days: 7  # 保留7天
        
    - name: Summary
      run: |
        echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Build Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "dist" ]; then
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for file in dist/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              size=$(du -h "$file" | cut -f1)
              echo "| $filename | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ⚡ Performance:" >> $GITHUB_STEP_SUMMARY
        echo "- Runner: Self-Hosted (Local Machine)" >> $GITHUB_STEP_SUMMARY
        echo "- Platform: $(uname -s)" >> $GITHUB_STEP_SUMMARY
        echo "- Architecture: $(uname -m)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✨ This build was completed on your local machine!" >> $GITHUB_STEP_SUMMARY