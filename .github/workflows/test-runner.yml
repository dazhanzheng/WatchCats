name: Test Self-Hosted Runner

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-runner:
    name: Test Runner Connection
    # 尝试不同的标签组合
    runs-on: self-hosted  # 最简单的配置
    
    steps:
    - name: Check runner info
      run: |
        echo "Runner name: ${{ runner.name }}"
        echo "Runner OS: ${{ runner.os }}"
        echo "Runner Arch: ${{ runner.arch }}"
        echo "Runner Temp: ${{ runner.temp }}"
        
    - name: Check environment (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Write-Host "Computer Name: $env:COMPUTERNAME"
        Write-Host "User Name: $env:USERNAME"
        Write-Host "OS Version: $([System.Environment]::OSVersion.VersionString)"
        Write-Host "Current Directory: $pwd"
        Write-Host "Python Version:"
        python --version
        
    - name: Check environment (Unix)
      if: runner.os != 'Windows'
      run: |
        echo "Hostname: $(hostname)"
        echo "User: $(whoami)"
        echo "OS: $(uname -a)"
        echo "Current Directory: $(pwd)"
        echo "Python Version:"
        python3 --version || python --version
        
  test-windows-specific:
    name: Test Windows Runner
    runs-on: [self-hosted, Windows]  # 注意 Windows 首字母大写
    
    steps:
    - name: Windows specific test
      shell: powershell
      run: |
        Write-Host "Testing Windows runner"
        Write-Host "Computer: $env:COMPUTERNAME"
        
  test-dnf-runner:
    name: Test DNF-DELLWORKSTA
    runs-on: [self-hosted, DNF-DELLWORKSTA]
    
    steps:
    - name: Test specific runner
      shell: powershell
      run: |
        Write-Host "Testing DNF-DELLWORKSTA runner"
        Write-Host "This should run on: $env:COMPUTERNAME"