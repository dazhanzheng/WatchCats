name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Application
    # 只在 self-hosted runner 上运行
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0
    
    - name: Setup environment
      shell: powershell
      run: |
        Write-Host "===================================" -ForegroundColor Cyan
        Write-Host " Baal Desktop Pet - Windows Build" -ForegroundColor Cyan
        Write-Host "===================================" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "Runner: $env:COMPUTERNAME" -ForegroundColor Yellow
        Write-Host "Time: $(Get-Date)" -ForegroundColor Yellow
        Write-Host "Commit: ${{ github.sha }}" -ForegroundColor Yellow
        Write-Host ""
        
        # 清理旧文件
        Write-Host "Cleaning old build files..." -ForegroundColor Green
        Remove-Item -Path build, dist, venv -Recurse -Force -ErrorAction SilentlyContinue
    
    - name: Setup Python environment
      shell: powershell
      run: |
        Write-Host "Creating virtual environment..." -ForegroundColor Green
        python -m venv venv
        
        Write-Host "Installing dependencies..." -ForegroundColor Green
        & .\venv\Scripts\Activate.ps1
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
        Write-Host "Installed packages:" -ForegroundColor Green
        pip list
    
    - name: Build with PyInstaller
      shell: powershell
      run: |
        & .\venv\Scripts\Activate.ps1
        
        Write-Host "Building executable..." -ForegroundColor Green
        
        # 使用适当的 spec 文件
        $specFile = if (Test-Path "baal_windows.spec") {
          "baal_windows.spec"
        } else {
          "baal.spec"
        }
        
        Write-Host "Using spec file: $specFile" -ForegroundColor Yellow
        pyinstaller --clean --noconfirm $specFile
        
        # 检查构建结果
        $exeFiles = Get-ChildItem -Path dist -Filter "*.exe" -ErrorAction SilentlyContinue
        if ($exeFiles) {
          Write-Host ""
          Write-Host "Build successful!" -ForegroundColor Green
          foreach ($exe in $exeFiles) {
            $sizeMB = [math]::Round($exe.Length / 1MB, 2)
            Write-Host "  - $($exe.Name) ($sizeMB MB)" -ForegroundColor Cyan
          }
        } else {
          Write-Error "Build failed - no exe found"
          exit 1
        }
    
    - name: Create installer (optional)
      shell: powershell
      continue-on-error: true
      run: |
        # 查找 Inno Setup
        $innoSetupPaths = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
          "C:\Program Files\Inno Setup 6\ISCC.exe"
        )
        
        $iscc = $null
        foreach ($path in $innoSetupPaths) {
          if (Test-Path $path) {
            $iscc = $path
            break
          }
        }
        
        if ($iscc) {
          Write-Host "Creating installer with Inno Setup..." -ForegroundColor Green
          
          # 检查安装脚本
          if (Test-Path "installer\windows\baal_setup.iss") {
            & $iscc /Q "installer\windows\baal_setup.iss"
            
            if (Test-Path "installer\windows\Output\*.exe") {
              Write-Host "Installer created successfully!" -ForegroundColor Green
            }
          } else {
            Write-Host "No installer script found, skipping installer creation" -ForegroundColor Yellow
          }
        } else {
          Write-Host "Inno Setup not found, skipping installer creation" -ForegroundColor Yellow
        }
    
    - name: Package artifacts
      shell: powershell
      run: |
        Write-Host "Packaging artifacts..." -ForegroundColor Green
        
        # 创建 artifacts 目录
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        
        # 复制可执行文件
        Copy-Item -Path "dist\*.exe" -Destination artifacts\
        
        # 复制安装程序（如果存在）
        if (Test-Path "installer\windows\Output\*.exe") {
          Copy-Item -Path "installer\windows\Output\*.exe" -Destination artifacts\
        }
        
        # 创建 ZIP 包
        $version = if ("${{ github.ref }}" -match "refs/tags/(.+)") {
          $matches[1]
        } else {
          "latest"
        }
        
        $zipName = "BaalDesktopPet-Windows-${version}.zip"
        Compress-Archive -Path "dist\*" -DestinationPath "artifacts\$zipName"
        
        Write-Host ""
        Write-Host "Artifacts:" -ForegroundColor Green
        Get-ChildItem artifacts\* | ForEach-Object {
          $sizeMB = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  - $($_.Name) ($sizeMB MB)" -ForegroundColor Cyan
        }
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: artifacts/
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: false
        name: Release ${{ github.ref_name }}
        body: |
          # Baal Desktop Pet ${{ github.ref_name }}
          
          ## 📦 下载
          
          - **Windows 安装程序**: `BaalDesktopPetSetup.exe`（推荐）
          - **Windows 便携版**: `BaalDesktopPet-Windows-${{ github.ref_name }}.zip`
          
          ## 📝 更新内容
          
          请查看提交历史了解详细更新内容。
          
          ---
          *Built on self-hosted runner*
        files: |
          artifacts/*.zip
          artifacts/*.exe
    
    - name: Cleanup
      if: always()
      shell: powershell
      run: |
        Write-Host "Cleaning up..." -ForegroundColor Green
        Remove-Item -Path venv, build, dist -Recurse -Force -ErrorAction SilentlyContinue