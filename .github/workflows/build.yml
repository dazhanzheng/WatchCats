name: Build Simple

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0
    
    - name: Setup environment
      shell: powershell
      run: |
        Write-Host "====================================" -ForegroundColor Cyan
        Write-Host " Baal Desktop Pet - Windows Build" -ForegroundColor Cyan
        Write-Host "====================================" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "Runner: $env:COMPUTERNAME" -ForegroundColor Yellow
        Write-Host "Directory: $pwd" -ForegroundColor Yellow
        Write-Host "Time: $(Get-Date)" -ForegroundColor Yellow
        
        # 查找并设置 Python
        Write-Host ""
        Write-Host "Searching for Python..." -ForegroundColor Green
        
        # 查找 Python 的常见位置（扩展搜索）
        $pythonPaths = @()
        
        # 添加所有可能的 Python 位置
        $searchDirs = @(
          "C:\",
          "C:\Program Files\",
          "C:\Program Files (x86)\",
          "$env:LOCALAPPDATA\Programs\",
          "$env:ProgramFiles\",
          "${env:ProgramFiles(x86)}\"
        )
        
        # 搜索 Python* 目录
        foreach ($dir in $searchDirs) {
          if (Test-Path $dir) {
            $pythonDirs = Get-ChildItem -Path $dir -Directory -Filter "Python*" -ErrorAction SilentlyContinue
            foreach ($pyDir in $pythonDirs) {
              $exePath = Join-Path $pyDir.FullName "python.exe"
              if (Test-Path $exePath) {
                $pythonPaths += $exePath
              }
            }
          }
        }
        
        # 添加常见的直接路径（包括 Python 3.13）
        $pythonPaths += @(
          "C:\Python\python.exe",
          "C:\Python3\python.exe",
          "C:\Python37\python.exe",
          "C:\Python38\python.exe",
          "C:\Python39\python.exe",
          "C:\Python310\python.exe",
          "C:\Python311\python.exe",
          "C:\Python312\python.exe",
          "C:\Python313\python.exe",
          "C:\Program Files\Python313\python.exe",
          "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe"
        )
        
        $pythonFound = $false
        $pythonExe = ""
        
        # 先检查 PATH 中的 python
        $pathPython = Get-Command python -ErrorAction SilentlyContinue
        if ($pathPython) {
          $pythonExe = $pathPython.Source
          Write-Host "Found Python in PATH: $pythonExe" -ForegroundColor Green
          $pythonFound = $true
        } else {
          Write-Host "Python not in PATH, searching common locations..." -ForegroundColor Yellow
          
          # 搜索常见位置
          foreach ($path in $pythonPaths) {
            if (Test-Path $path) {
              $pythonExe = $path
              Write-Host "Found Python at: $pythonExe" -ForegroundColor Green
              
              # 将找到的 Python 添加到当前会话的 PATH
              $pythonDir = Split-Path $pythonExe
              $env:PATH = "$pythonDir;$env:PATH"
              Write-Host "Added to PATH: $pythonDir" -ForegroundColor Cyan
              $pythonFound = $true
              break
            }
          }
        }
        
        if (-not $pythonFound) {
          Write-Error "Python not found! Please install Python 3.9 or later."
          Write-Host ""
          Write-Host "Searched locations:" -ForegroundColor Yellow
          foreach ($path in $pythonPaths) {
            Write-Host "  - $path" -ForegroundColor Gray
          }
          exit 1
        }
        
        # 显示 Python 信息
        Write-Host ""
        Write-Host "Python information:" -ForegroundColor Green
        $version = & $pythonExe --version 2>&1
        Write-Host "Version: $version" -ForegroundColor Cyan
        Write-Host "Path: $pythonExe" -ForegroundColor Cyan
        
        # 创建 python 别名（如果需要）
        if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
          Write-Host "Creating python alias..." -ForegroundColor Yellow
          Set-Alias -Name python -Value $pythonExe -Scope Global
        }
        
        # 清理旧文件
        Write-Host ""
        Write-Host "Cleaning old files..." -ForegroundColor Green
        @("build", "dist", "__pycache__") | ForEach-Object {
          if (Test-Path $_) {
            Remove-Item -Path $_ -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  - Removed $_" -ForegroundColor Gray
          }
        }
    
    - name: Install dependencies (no venv)
      shell: powershell
      run: |
        Write-Host "Installing dependencies directly to user..." -ForegroundColor Green
        
        # 获取 Python 路径
        $pythonExe = Get-Command python -ErrorAction SilentlyContinue
        if ($pythonExe) {
          $python = "python"
        } else {
          # 查找 Python
          $pythonPaths = @(
            "C:\Python39\python.exe",
            "C:\Python310\python.exe",
            "C:\Python311\python.exe",
            "C:\Python312\python.exe",
            "C:\Python313\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python39\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python310\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe"
          )
          
          $python = ""
          foreach ($path in $pythonPaths) {
            if (Test-Path $path) {
              $python = $path
              Write-Host "Using Python: $python" -ForegroundColor Cyan
              break
            }
          }
          
          if (-not $python) {
            Write-Error "Python not found!"
            exit 1
          }
        }
        
        # 升级 pip
        Write-Host "Upgrading pip..." -ForegroundColor Yellow
        & $python -m pip install --upgrade pip --user --no-warn-script-location
        
        # 安装 PyInstaller
        Write-Host "Installing PyInstaller..." -ForegroundColor Yellow
        & $python -m pip install "pyinstaller==6.11.1" --user --no-warn-script-location --force-reinstall
        
        # 安装项目依赖
        Write-Host "Installing requirements..." -ForegroundColor Yellow
        & $python -m pip install -r requirements.txt --user --no-warn-script-location
        
        # 显示安装的包
        Write-Host ""
        Write-Host "Key packages:" -ForegroundColor Green
        & $python -m pip list | Select-String -Pattern "PyQt6|pyinstaller|langchain|aw-"
    
    - name: Build with PyInstaller
      shell: powershell
      run: |
        Write-Host "Building executable..." -ForegroundColor Green
        
        # 获取 Python 路径
        $pythonExe = Get-Command python -ErrorAction SilentlyContinue
        if ($pythonExe) {
          $python = "python"
        } else {
          # 查找 Python
          $pythonPaths = @(
            "C:\Python39\python.exe",
            "C:\Python310\python.exe",
            "C:\Python311\python.exe",
            "C:\Python312\python.exe",
            "C:\Python313\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python39\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python310\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe"
          )
          
          $python = ""
          foreach ($path in $pythonPaths) {
            if (Test-Path $path) {
              $python = $path
              Write-Host "Using Python: $python" -ForegroundColor Cyan
              break
            }
          }
          
          if (-not $python) {
            Write-Error "Python not found!"
            exit 1
          }
        }
        
        # 确定 spec 文件
        $specFile = if (Test-Path "baal_windows.spec") {
          "baal_windows.spec"
        } elseif (Test-Path "baal.spec") {
          "baal.spec"
        } else {
          Write-Error "No spec file found!"
          exit 1
        }
        
        Write-Host "Using spec file: $specFile" -ForegroundColor Yellow
        
        # 清理缓存
        if ($env:APPDATA) {
          $cacheDir = "$env:APPDATA\pyinstaller"
          if (Test-Path $cacheDir) {
            Remove-Item -Path $cacheDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Cleaned PyInstaller cache" -ForegroundColor Gray
          }
        }
        
        # 运行 PyInstaller
        Write-Host "Running PyInstaller..." -ForegroundColor Cyan
        & $python -m PyInstaller --clean --noconfirm $specFile
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "PyInstaller failed with exit code $LASTEXITCODE"
          exit 1
        }
        
        # 检查输出
        Write-Host ""
        Write-Host "Checking output..." -ForegroundColor Yellow
        
        $exeFiles = Get-ChildItem -Path "dist" -Filter "*.exe" -ErrorAction SilentlyContinue
        if ($exeFiles) {
          Write-Host "✓ Build successful!" -ForegroundColor Green
          foreach ($exe in $exeFiles) {
            $sizeMB = [math]::Round($exe.Length / 1MB, 2)
            Write-Host "  - $($exe.Name) ($sizeMB MB)" -ForegroundColor Cyan
          }
        } else {
          Write-Error "No executable found in dist!"
          exit 1
        }
    
    - name: Package artifacts
      shell: powershell
      run: |
        Write-Host "Packaging artifacts..." -ForegroundColor Green
        
        # 创建 artifacts 目录
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        
        # 复制 exe 文件
        Get-ChildItem -Path "dist" -Filter "*.exe" | ForEach-Object {
          Copy-Item -Path $_.FullName -Destination "artifacts\"
          Write-Host "  - Copied: $($_.Name)" -ForegroundColor Gray
        }
        
        # 创建 ZIP
        $version = if ("${{ github.ref }}" -match "refs/tags/v(.+)") {
          $matches[1]
        } else {
          "latest"
        }
        
        $zipName = "BaalDesktopPet-Windows-${version}.zip"
        Write-Host "Creating: $zipName" -ForegroundColor Yellow
        
        Compress-Archive -Path "dist\*" -DestinationPath "artifacts\$zipName" -Force
        
        # 显示最终 artifacts
        Write-Host ""
        Write-Host "Artifacts:" -ForegroundColor Green
        Get-ChildItem "artifacts" | ForEach-Object {
          $sizeMB = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  - $($_.Name) ($sizeMB MB)" -ForegroundColor Cyan
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-${{ github.run_number }}
        path: artifacts/
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false
        name: Release ${{ github.ref_name }}
        files: |
          artifacts/*.zip
          artifacts/*.exe
        fail_on_unmatched_files: false
        generate_release_notes: true
    
    - name: Cleanup
      if: always()
      shell: powershell
      run: |
        Write-Host "Cleaning up..." -ForegroundColor Green
        @("build", "dist", "__pycache__") | ForEach-Object {
          if (Test-Path $_) {
            Remove-Item -Path $_ -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  - Cleaned $_" -ForegroundColor Gray
          }
        }