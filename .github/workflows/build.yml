name: Build Simple

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0
    
    - name: Setup environment
      shell: powershell
      run: |
        Write-Host "====================================" -ForegroundColor Cyan
        Write-Host " Baal Desktop Pet - Windows Build" -ForegroundColor Cyan
        Write-Host "====================================" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "Runner: $env:COMPUTERNAME" -ForegroundColor Yellow
        Write-Host "Directory: $pwd" -ForegroundColor Yellow
        Write-Host "Time: $(Get-Date)" -ForegroundColor Yellow
        
        # Python 信息
        Write-Host ""
        Write-Host "Python information:" -ForegroundColor Green
        python --version
        python -c "import sys; print(f'Python path: {sys.executable}')"
        
        # 清理旧文件
        Write-Host ""
        Write-Host "Cleaning old files..." -ForegroundColor Green
        @("build", "dist", "__pycache__") | ForEach-Object {
          if (Test-Path $_) {
            Remove-Item -Path $_ -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  - Removed $_" -ForegroundColor Gray
          }
        }
    
    - name: Install dependencies (no venv)
      shell: powershell
      run: |
        Write-Host "Installing dependencies directly to user..." -ForegroundColor Green
        
        # 升级 pip
        Write-Host "Upgrading pip..." -ForegroundColor Yellow
        python -m pip install --upgrade pip --user --no-warn-script-location
        
        # 安装 PyInstaller
        Write-Host "Installing PyInstaller..." -ForegroundColor Yellow
        python -m pip install "pyinstaller==6.11.1" --user --no-warn-script-location --force-reinstall
        
        # 安装项目依赖
        Write-Host "Installing requirements..." -ForegroundColor Yellow
        python -m pip install -r requirements.txt --user --no-warn-script-location
        
        # 显示安装的包
        Write-Host ""
        Write-Host "Key packages:" -ForegroundColor Green
        python -m pip list | Select-String -Pattern "PyQt6|pyinstaller|langchain|aw-"
    
    - name: Build with PyInstaller
      shell: powershell
      run: |
        Write-Host "Building executable..." -ForegroundColor Green
        
        # 确定 spec 文件
        $specFile = if (Test-Path "baal_windows.spec") {
          "baal_windows.spec"
        } elseif (Test-Path "baal.spec") {
          "baal.spec"
        } else {
          Write-Error "No spec file found!"
          exit 1
        }
        
        Write-Host "Using spec file: $specFile" -ForegroundColor Yellow
        
        # 清理缓存
        if ($env:APPDATA) {
          $cacheDir = "$env:APPDATA\pyinstaller"
          if (Test-Path $cacheDir) {
            Remove-Item -Path $cacheDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Cleaned PyInstaller cache" -ForegroundColor Gray
          }
        }
        
        # 运行 PyInstaller
        Write-Host "Running PyInstaller..." -ForegroundColor Cyan
        python -m PyInstaller --clean --noconfirm $specFile
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "PyInstaller failed with exit code $LASTEXITCODE"
          exit 1
        }
        
        # 检查输出
        Write-Host ""
        Write-Host "Checking output..." -ForegroundColor Yellow
        
        $exeFiles = Get-ChildItem -Path "dist" -Filter "*.exe" -ErrorAction SilentlyContinue
        if ($exeFiles) {
          Write-Host "✓ Build successful!" -ForegroundColor Green
          foreach ($exe in $exeFiles) {
            $sizeMB = [math]::Round($exe.Length / 1MB, 2)
            Write-Host "  - $($exe.Name) ($sizeMB MB)" -ForegroundColor Cyan
          }
        } else {
          Write-Error "No executable found in dist!"
          exit 1
        }
    
    - name: Package artifacts
      shell: powershell
      run: |
        Write-Host "Packaging artifacts..." -ForegroundColor Green
        
        # 创建 artifacts 目录
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        
        # 复制 exe 文件
        Get-ChildItem -Path "dist" -Filter "*.exe" | ForEach-Object {
          Copy-Item -Path $_.FullName -Destination "artifacts\"
          Write-Host "  - Copied: $($_.Name)" -ForegroundColor Gray
        }
        
        # 创建 ZIP
        $version = if ("${{ github.ref }}" -match "refs/tags/v(.+)") {
          $matches[1]
        } else {
          "latest"
        }
        
        $zipName = "BaalDesktopPet-Windows-${version}.zip"
        Write-Host "Creating: $zipName" -ForegroundColor Yellow
        
        Compress-Archive -Path "dist\*" -DestinationPath "artifacts\$zipName" -Force
        
        # 显示最终 artifacts
        Write-Host ""
        Write-Host "Artifacts:" -ForegroundColor Green
        Get-ChildItem "artifacts" | ForEach-Object {
          $sizeMB = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  - $($_.Name) ($sizeMB MB)" -ForegroundColor Cyan
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-${{ github.run_number }}
        path: artifacts/
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false
        name: Release ${{ github.ref_name }}
        files: |
          artifacts/*.zip
          artifacts/*.exe
        fail_on_unmatched_files: false
        generate_release_notes: true
    
    - name: Cleanup
      if: always()
      shell: powershell
      run: |
        Write-Host "Cleaning up..." -ForegroundColor Green
        @("build", "dist", "__pycache__") | ForEach-Object {
          if (Test-Path $_) {
            Remove-Item -Path $_ -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  - Cleaned $_" -ForegroundColor Gray
          }
        }