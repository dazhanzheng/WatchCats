name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  PYINSTALLER_VERSION: '6.11.1'

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0
    
    - name: Setup Python environment
      shell: powershell
      run: |
        Write-Host "================================================" -ForegroundColor Cyan
        Write-Host " Baal Desktop Pet - Windows Build Setup" -ForegroundColor Cyan
        Write-Host "================================================" -ForegroundColor Cyan
        Write-Host ""
        Write-Host "Build Information:" -ForegroundColor Green
        Write-Host "  Runner: $env:COMPUTERNAME" -ForegroundColor Gray
        Write-Host "  Directory: $pwd" -ForegroundColor Gray
        Write-Host "  Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -ForegroundColor Gray
        Write-Host "  Commit: ${{ github.sha }}" -ForegroundColor Gray
        Write-Host ""
        
        # 查找 Python（简单版本，因为我们知道 Python 已安装）
        Write-Host "Verifying Python installation..." -ForegroundColor Yellow
        
        # 尝试使用 python 命令
        $pythonCmd = Get-Command python -ErrorAction SilentlyContinue
        if ($pythonCmd -and $pythonCmd.Source -notlike "*WindowsApps*") {
          $python = "python"
        } else {
          # 如果 python 命令不可用，查找常见位置
          $pythonPaths = @(
            "C:\Python313\python.exe",
            "C:\Program Files\Python313\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe",
            "C:\Python39\python.exe",
            "C:\Python310\python.exe",
            "C:\Python311\python.exe",
            "C:\Python312\python.exe"
          )
          
          $python = $pythonPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          
          if ($python) {
            # 添加到 PATH 以便后续步骤使用
            $pythonDir = Split-Path $python
            $env:PATH = "$pythonDir;$env:PATH"
            Write-Host "Added Python to PATH: $pythonDir" -ForegroundColor Green
          } else {
            Write-Error "Python not found. Please ensure Python 3.9+ is installed."
            exit 1
          }
        }
        
        # 显示 Python 版本
        $version = & $python --version 2>&1
        Write-Host "Python version: $version" -ForegroundColor Green
        
        # 设置环境变量供后续步骤使用
        echo "PYTHON_CMD=$python" >> $env:GITHUB_ENV
    
    - name: Create virtual environment
      shell: powershell
      run: |
        Write-Host "Creating virtual environment..." -ForegroundColor Yellow
        
        $python = $env:PYTHON_CMD
        if (-not $python) { $python = "python" }
        
        # 清理旧的虚拟环境
        if (Test-Path venv) {
          Write-Host "Removing old virtual environment..." -ForegroundColor Gray
          Remove-Item -Path venv -Recurse -Force
        }
        
        # 创建新的虚拟环境
        & $python -m venv venv
        
        # 验证虚拟环境
        if (Test-Path "venv\Scripts\python.exe") {
          Write-Host "✓ Virtual environment created successfully" -ForegroundColor Green
          
          # 显示虚拟环境的 Python 版本
          $venvVersion = & "venv\Scripts\python.exe" --version 2>&1
          Write-Host "Virtual environment Python: $venvVersion" -ForegroundColor Gray
        } else {
          Write-Error "Failed to create virtual environment"
          exit 1
        }
    
    - name: Install dependencies
      shell: powershell
      run: |
        Write-Host "Installing dependencies..." -ForegroundColor Yellow
        
        # 升级 pip 和基础工具
        & venv\Scripts\python.exe -m pip install --upgrade pip wheel setuptools
        
        # 安装 PyInstaller
        Write-Host "Installing PyInstaller..." -ForegroundColor Gray
        & venv\Scripts\python.exe -m pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
        
        # 尝试安装预编译的 PyQt6 包（避免编译）
        Write-Host "Installing PyQt6 (precompiled wheels)..." -ForegroundColor Gray
        & venv\Scripts\python.exe -m pip install --only-binary :all: PyQt6==6.5.3 PyQt6-Qt6==6.5.3
        
        # 如果 PyQt6-sip 需要编译，使用预编译版本或降级
        Write-Host "Installing PyQt6-sip..." -ForegroundColor Gray
        & venv\Scripts\python.exe -m pip install PyQt6-sip==13.6.0 --prefer-binary
        if ($LASTEXITCODE -ne 0) {
          Write-Host "PyQt6-sip compilation failed, trying alternative..." -ForegroundColor Yellow
          & venv\Scripts\python.exe -m pip install PyQt6-sip --prefer-binary
        }
        
        # 安装其他依赖（跳过有问题的包）
        Write-Host "Installing other dependencies..." -ForegroundColor Gray
        
        # 创建临时的 requirements 文件，排除 PyQt6-sip（将单独处理）
        $requirements = Get-Content requirements.txt | Where-Object { 
          $_ -notlike "*PyQt6-sip==*" -and
          $_ -notlike "#*" -and
          $_.Trim() -ne ""
        }
        $requirements | Set-Content requirements-temp.txt
        
        # 安装其他依赖
        & venv\Scripts\python.exe -m pip install -r requirements-temp.txt
        
        # 清理临时文件
        Remove-Item requirements-temp.txt -Force -ErrorAction SilentlyContinue
        
        Write-Host ""
        Write-Host "Installed packages:" -ForegroundColor Green
        & venv\Scripts\python.exe -m pip list | Select-String -Pattern "PyQt6|pyinstaller|langchain|aw-" | ForEach-Object {
          Write-Host "  $_" -ForegroundColor Gray
        }
    
    - name: Build executable
      shell: powershell
      run: |
        Write-Host "Building Windows executable..." -ForegroundColor Yellow
        
        # 确定使用哪个 spec 文件
        $specFile = if (Test-Path "baal_windows.spec") {
          "baal_windows.spec"
        } elseif (Test-Path "baal.spec") {
          "baal.spec"
        } else {
          Write-Error "No spec file found!"
          exit 1
        }
        
        Write-Host "Using spec file: $specFile" -ForegroundColor Gray
        
        # 清理构建缓存
        @("build", "dist", "$env:LOCALAPPDATA\pyinstaller") | ForEach-Object {
          if ($_ -and (Test-Path $_)) {
            Remove-Item -Path $_ -Recurse -Force -ErrorAction SilentlyContinue
          }
        }
        
        # 运行 PyInstaller
        & venv\Scripts\python.exe -m PyInstaller --clean --noconfirm $specFile
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed with exit code $LASTEXITCODE"
          exit 1
        }
        
        # 验证输出
        Write-Host ""
        Write-Host "Build output:" -ForegroundColor Green
        Get-ChildItem -Path dist -Filter "*.exe" | ForEach-Object {
          $sizeMB = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  ✓ $($_.Name) ($sizeMB MB)" -ForegroundColor Green
        }
        
        if (-not (Test-Path "dist\*.exe")) {
          Write-Error "No executable found in dist directory"
          exit 1
        }
    
    - name: Prepare installer resources
      shell: powershell
      run: |
        Write-Host "Preparing installer resources..." -ForegroundColor Yellow
        
        # 检查并创建必要的目录
        if (-not (Test-Path "installer\icons")) {
          New-Item -ItemType Directory -Force -Path "installer\icons" | Out-Null
        }
        
        if (-not (Test-Path "installer\vcredist")) {
          New-Item -ItemType Directory -Force -Path "installer\vcredist" | Out-Null
        }
        
        # 准备高质量图标文件
        if (Test-Path "baal\resources\app_icon.ico") {
          Copy-Item "baal\resources\app_icon.ico" "installer\icons\WatchCats.ico" -Force
          Write-Host "✓ Copied application icon" -ForegroundColor Green
        } else {
          Write-Host "Warning: app_icon.ico not found" -ForegroundColor Yellow
        }
        
        # 准备 PNG 图标（如果存在）
        if (Test-Path "baal\resources\cat.png") {
          Copy-Item "baal\resources\cat.png" "installer\icons\WatchCats_256.png" -Force
          Write-Host "✓ Copied PNG icon" -ForegroundColor Green
        }
        
        # 下载 Visual C++ Redistributables
        Write-Host "Downloading Visual C++ Redistributables..." -ForegroundColor Yellow
        
        $vcredistUrls = @{
          "x64" = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          "x86" = "https://aka.ms/vs/17/release/vc_redist.x86.exe"
        }
        
        foreach ($arch in $vcredistUrls.Keys) {
          $url = $vcredistUrls[$arch]
          $output = "installer\vcredist\vc_redist.$arch.exe"
          
          if (-not (Test-Path $output)) {
            try {
              Write-Host "  Downloading $arch redistributable..." -ForegroundColor Gray
              Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
              Write-Host "  ✓ Downloaded vc_redist.$arch.exe" -ForegroundColor Green
            } catch {
              Write-Host "  Warning: Failed to download $arch redistributable" -ForegroundColor Yellow
              Write-Host "  Error: $_" -ForegroundColor Red
            }
          } else {
            Write-Host "  ✓ vc_redist.$arch.exe already exists" -ForegroundColor Green
          }
        }
        
        # 创建配置模板文件
        $configTemplate = @{
          version = "0.1.3"
          first_run = $true
          language = "zh_CN"
          api_key = "6be4b0c1-8e71-4530-908a-cbe4b48a9a07"
          base_url = "https://ark.cn-beijing.volces.com/api/v3"
          model = "doubao-seed-1-6-flash-250715"
        } | ConvertTo-Json -Depth 10
        
        $configTemplate | Set-Content -Path "installer\config_template.json" -Encoding UTF8
        Write-Host "✓ Created config template" -ForegroundColor Green
        
        # 创建 installer wizard 图片（如果需要）
        if (-not (Test-Path "installer\installer_wizard.bmp")) {
          Write-Host "Note: installer_wizard.bmp not found (using defaults)" -ForegroundColor Yellow
        }
    
    - name: Build installer with Inno Setup
      shell: powershell
      run: |
        Write-Host "Building installer with Inno Setup..." -ForegroundColor Yellow
        
        # 查找 Inno Setup
        $isccPaths = @(
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
          "C:\Program Files\Inno Setup 6\ISCC.exe",
          "D:\Program Files\Inno Setup 6\ISCC.exe",
          "D:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        )
        
        $iscc = $isccPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
        
        if (-not $iscc) {
          Write-Host "Inno Setup not found. Attempting to install..." -ForegroundColor Yellow
          
          # 下载 Inno Setup
          $innoUrl = "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe"
          $innoInstaller = "$env:TEMP\innosetup.exe"
          
          try {
            Write-Host "Downloading Inno Setup..." -ForegroundColor Gray
            Invoke-WebRequest -Uri $innoUrl -OutFile $innoInstaller -UseBasicParsing
            
            Write-Host "Installing Inno Setup silently..." -ForegroundColor Gray
            Start-Process -FilePath $innoInstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait
            
            # 再次查找
            $iscc = $isccPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
            
            if ($iscc) {
              Write-Host "✓ Inno Setup installed successfully" -ForegroundColor Green
            } else {
              Write-Host "Error: Inno Setup installation failed" -ForegroundColor Red
              exit 1
            }
          } catch {
            Write-Host "Error downloading/installing Inno Setup: $_" -ForegroundColor Red
            exit 1
          }
        } else {
          Write-Host "✓ Found Inno Setup at: $iscc" -ForegroundColor Green
        }
        
        # 检查 ISS 文件
        $issFile = "installer\baal_installer.iss"
        if (-not (Test-Path $issFile)) {
          Write-Host "Error: $issFile not found!" -ForegroundColor Red
          exit 1
        }
        
        Write-Host "Compiling installer..." -ForegroundColor Yellow
        
        # 编译安装包
        $arguments = @(
          "/Q",  # Quiet mode
          "/O`"installer\Output`"",  # Output directory
          "/F`"WatchCats-Setup`"",  # Output filename
          "`"$issFile`""
        )
        
        & $iscc $arguments
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✓ Installer compiled successfully!" -ForegroundColor Green
          
          # 验证输出
          $installerPath = "installer\Output\WatchCats-Setup.exe"
          if (Test-Path $installerPath) {
            $size = [math]::Round((Get-Item $installerPath).Length / 1MB, 2)
            Write-Host "✓ Created installer: WatchCats-Setup.exe ($size MB)" -ForegroundColor Green
            
            # 显示安装包信息
            Write-Host "" -ForegroundColor Gray
            Write-Host "Installer Information:" -ForegroundColor Cyan
            Write-Host "  Path: $installerPath" -ForegroundColor Gray
            Write-Host "  Size: $size MB" -ForegroundColor Gray
            Write-Host "  Features:" -ForegroundColor Gray
            Write-Host "    • Visual C++ Runtime installation" -ForegroundColor Gray
            Write-Host "    • Data migration from old versions" -ForegroundColor Gray
            Write-Host "    • Desktop shortcut creation" -ForegroundColor Gray
            Write-Host "    • Auto-start configuration" -ForegroundColor Gray
            Write-Host "    • Uninstaller included" -ForegroundColor Gray
          } else {
            Write-Host "Warning: Installer file not found after compilation" -ForegroundColor Yellow
          }
        } else {
          Write-Host "Error: Installer compilation failed with exit code $LASTEXITCODE" -ForegroundColor Red
          exit 1
        }
    
    - name: Package artifacts
      shell: powershell
      run: |
        Write-Host "Packaging build artifacts..." -ForegroundColor Yellow
        
        # 创建 artifacts 目录
        New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        
        # 复制可执行文件（便携版）
        Get-ChildItem -Path dist -Filter "*.exe" | ForEach-Object {
          Copy-Item -Path $_.FullName -Destination "artifacts\WatchCats-Portable.exe"
          Write-Host "  Copied portable: WatchCats-Portable.exe" -ForegroundColor Gray
        }
        
        # 复制安装程序（如果存在）
        if (Test-Path "installer\Output\WatchCats-Setup.exe") {
          Copy-Item -Path "installer\Output\WatchCats-Setup.exe" -Destination "artifacts\WatchCats-Setup.exe"
          Write-Host "  Copied installer: WatchCats-Setup.exe" -ForegroundColor Gray
          
          $installerSize = [math]::Round((Get-Item "artifacts\WatchCats-Setup.exe").Length / 1MB, 2)
          Write-Host "    Installer size: ${installerSize}MB" -ForegroundColor Gray
        } else {
          Write-Host "  Warning: Installer not found" -ForegroundColor Yellow
        }
        
        # 创建版本信息文件
        $version = if ("${{ github.ref }}" -match "refs/tags/v(.+)") {
          $matches[1]
        } else {
          "dev-${{ github.run_number }}"
        }
        
        @{
          Version = $version
          Commit = "${{ github.sha }}"
          Branch = "${{ github.ref_name }}"
          BuildTime = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          Runner = $env:COMPUTERNAME
        } | ConvertTo-Json | Set-Content -Path "artifacts\build-info.json"
        
        # 创建 ZIP 包
        $zipName = "BaalDesktopPet-Windows-${version}.zip"
        Write-Host "Creating ZIP: $zipName" -ForegroundColor Green
        
        Compress-Archive -Path dist\* -DestinationPath "artifacts\$zipName" -Force
        
        # 显示最终的 artifacts
        Write-Host ""
        Write-Host "Build artifacts:" -ForegroundColor Green
        Get-ChildItem artifacts | ForEach-Object {
          $size = if ($_.Length -ge 1MB) {
            "$([math]::Round($_.Length / 1MB, 2)) MB"
          } else {
            "$([math]::Round($_.Length / 1KB, 2)) KB"
          }
          Write-Host "  • $($_.Name) ($size)" -ForegroundColor Gray
        }
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build-${{ github.run_number }}
        path: artifacts/
        retention-days: 30
        if-no-files-found: error
    
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        body: |
          # WatchCats ${{ github.ref_name }}
          
          ## 📦 下载选项 Downloads
          
          ### 推荐 (Recommended)
          - **Windows 安装程序**: `WatchCats-Setup.exe`
            - 自动安装 Visual C++ 运行库
            - 自动迁移旧版本数据
            - 创建桌面快捷方式和开始菜单
            - 包含卸载程序
          
          ### 便携版 (Portable)
          - **Windows 便携版**: `WatchCats-Portable.exe`
            - 单文件，无需安装
            - 需要手动安装运行库（如果缺失）
            - 适合临时使用或测试
          
          ### 完整包 (Full Package)
          - **ZIP 压缩包**: `BaalDesktopPet-Windows-${{ github.ref_name }}.zip`
            - 包含所有文件和资源
            - 适合高级用户
          
          ## 🔧 系统要求 System Requirements
          
          - Windows 10/11 (64-bit)
          - Visual C++ Redistributable 2015-2022（安装程序会自动安装）
          - 不需要 Python 环境
          
          ## ⚙️ 安装说明 Installation
          
          1. **推荐方式**：下载并运行 `WatchCats-Setup.exe`
          2. **便携方式**：直接运行 `WatchCats-Portable.exe`
          
          ## 🔄 从旧版本升级 Upgrading
          
          安装程序会自动迁移以下数据：
          - API 密钥配置
          - 对话历史记录
          - 日程安排
          - 监督目标设置
          
          ## 📝 更新日志 Changelog
          
          查看提交历史了解详细更改。
          See commit history for detailed changes.
          
          ---
          *Built on self-hosted runner: DNF-DELLWORKSTA*
        files: |
          artifacts/WatchCats-Setup.exe
          artifacts/WatchCats-Portable.exe
          artifacts/*.zip
        fail_on_unmatched_files: false
        generate_release_notes: true
    
    - name: Cleanup
      if: always()
      shell: powershell
      run: |
        Write-Host "Cleaning up workspace..." -ForegroundColor Yellow
        
        # 清理构建文件（保留源代码）
        @("venv", "build", "dist", "__pycache__", ".pytest_cache") | ForEach-Object {
          if (Test-Path $_) {
            Remove-Item -Path $_ -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "  Cleaned: $_" -ForegroundColor Gray
          }
        }
        
        Write-Host "✓ Cleanup completed" -ForegroundColor Green